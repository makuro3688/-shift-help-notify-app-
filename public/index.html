<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasuel+ ｜ ヘルプ通知登録</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: #f4f6f9; padding: 20px; text-align: center; }
  .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 400px; margin: 40px auto; }
  .brand { font-size: 12px; font-weight: 800; letter-spacing: 0.5px; color: #00a8ff; margin: 0 0 8px; }
  label { display: block; font-size: 13px; color: #555; margin-top: 6px; margin-bottom: 4px; text-align: left; }
  select, input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 15px; font-family: inherit; background: white; }
  button { background: #00a8ff; color: white; border: none; padding: 16px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
  button:disabled { background: #b0c4d4; }
  .note { color: #7f8c8d; font-size: 13px; margin-top: 16px; line-height: 1.6; }
  .status { margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>

<div class="card" id="card">
  <p class="brand">Tasuel+</p>
  <h2>🤝 ヘルプ通知センター</h2>
  <p id="storeLine" style="color:#7f8c8d; font-size:14px; margin-top:10px;">読み込み中...</p>

  <div id="form" style="display:none;">
    <label>お名前（あだ名でも可）</label>
    <input id="staffName" placeholder="例：やまだ">

    <button id="registerBtn" onclick="enablePushNotification()">🔔 通知を許可して登録</button>
    <div id="status" class="status"></div>
    <p class="note">
      iPhoneの方へ：Safariで開いた後、共有ボタン→「ホーム画面に追加」してから、ホーム画面のアイコンで開いて登録してください（Safariのタブのままだと通知が許可できません）。
    </p>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const storeId = params.get('store');

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

async function loadStore() {
  const storeLine = document.getElementById('storeLine');
  const form = document.getElementById('form');
  if (!storeId) {
    storeLine.textContent = 'このリンクは正しくありません。店舗の店長からもらったQRコード・リンクを使って開いてください。';
    return;
  }
  try {
    const res = await fetch('/api/stores/' + encodeURIComponent(storeId));
    const data = await res.json();
    if (!res.ok) {
      storeLine.textContent = data.error || '店舗が見つかりません。リンクが正しいか確認してください。';
      return;
    }
    storeLine.innerHTML = `<strong>🏬 ${escapeHtml(data.name)}</strong> 向けの通知登録です。LINEも個人情報も不要です。`;
    form.style.display = 'block';
  } catch (err) {
    storeLine.textContent = '店舗情報の取得に失敗しました。';
  }
}

async function enablePushNotification() {
  const btn = document.getElementById('registerBtn');
  const staffName = document.getElementById('staffName').value.trim();

  if (!staffName) {
    setStatus('お名前（あだ名でも可）を入力してください。');
    return;
  }

  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    setStatus('お使いのブラウザはプッシュ通知に対応していません。(iPhoneの場合はホーム画面に追加してから開いてください)');
    return;
  }

  btn.disabled = true;
  try {
    const register = await navigator.serviceWorker.register('/sw.js');

    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      setStatus('通知が拒否されました。ブラウザの設定から許可してください。');
      btn.disabled = false;
      return;
    }

    const { publicKey } = await fetch('/api/vapid-public-key').then((r) => r.json());

    const subscription = await register.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey),
    });

    const res = await fetch('/api/subscribe', {
      method: 'POST',
      body: JSON.stringify({ subscription, store_id: storeId, staff_name: staffName }),
      headers: { 'Content-Type': 'application/json' },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '登録に失敗しました');

    setStatus('✅ ' + data.message + '。この画面は閉じてOKです。');
  } catch (err) {
    console.error(err);
    setStatus('登録中にエラーが発生しました：' + err.message);
    btn.disabled = false;
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

loadStore();
</script>
</body>
</html>
