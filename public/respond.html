<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAIDA+ ｜ ヘルプ応募</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: #f4f6f9; padding: 20px; text-align: center; }
  .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 400px; margin: 40px auto; }
  .brand { font-size: 12px; font-weight: 800; letter-spacing: 0.5px; color: #e74c3c; margin: 0 0 8px; }
  h2 { margin-top: 0; }
  .detail { text-align: left; background: #f8f9fb; padding: 14px; border-radius: 8px; margin: 16px 0; font-size: 14px; line-height: 1.7; }
  input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 15px; margin-top: 6px; font-family: inherit; background: white; }
  button { background: #27ae60; color: white; border: none; padding: 16px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
  button:disabled { background: #ccc; }
  .result { margin-top: 16px; font-size: 15px; font-weight: bold; }
  .filled { color: #e74c3c; }
  .ok { color: #27ae60; }
  .siteFooter { max-width: 400px; margin: 16px auto 10px; padding: 14px 0; text-align: center; font-size: 12px; color: #999; }
  .siteFooter a { color: #888; text-decoration: underline; }
  .subLink { display: block; margin-top: 16px; font-size: 12px; color: #999; text-decoration: underline; cursor: pointer; }
  .reportBox { margin-top: 10px; text-align: left; background: #f8f9fb; border-radius: 8px; padding: 12px; display: none; }
  .reportBox label { display: block; font-size: 13px; color: #555; margin-top: 6px; }
  .reportBox textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 13px; font-family: inherit; margin-top: 6px; }
  .reportBox button { padding: 10px; font-size: 13px; width: 100%; margin-top: 10px; background: #888; }
  .status { margin-top: 10px; font-size: 13px; }
  /* M-3: 18歳未満の深夜勤務（22時〜翌5時）に関する注意書き・警告のスタイル */
  .minorNightNote { text-align: left; font-size: 12px; color: #666; background: #f4f6f9; padding: 8px 10px; border-radius: 6px; margin: 10px 0; line-height: 1.6; }
  .minorNightWarning { text-align: left; font-size: 13px; font-weight: bold; color: #b02a2a; background: #fdecec; border: 1px solid #f5c6c6; padding: 10px 12px; border-radius: 6px; margin: 10px 0; line-height: 1.6; }
</style>
</head>
<body>
<div class="card" id="card">読み込み中...</div>

<footer class="siteFooter">
  <a href="https://daida-store.jp/terms" target="_blank" rel="noopener">利用規約</a>
  ｜
  <a href="https://daida-store.jp/privacy" target="_blank" rel="noopener">プライバシーポリシー</a>
  ｜
  <a href="https://daida-store.jp/tokushoho" target="_blank" rel="noopener">特定商取引法に基づく表記</a>
</footer>

<!-- M-3: 深夜勤務（22時〜翌5時）判定ロジック（lib/nightWork.js と同一。サーバー側のテストで検証済み） -->
<script src="/lib/nightWork.js"></script>
<script>
const params = new URLSearchParams(location.search);
const shiftId = params.get('id');
const card = document.getElementById('card');
let currentStoreId = null; // 通報API送信用。読み込んだ募集からstore_idを保持しておく

async function init() {
  if (!shiftId) {
    card.innerHTML = '<p>不正なURLです。</p>';
    return;
  }
  const res = await fetch('/api/shift/' + shiftId);
  const shift = await res.json();
  if (!res.ok) {
    card.innerHTML = `<p>${shift.error || '募集が見つかりません'}</p>`;
    return;
  }
  render(shift);
}

// 通報導線（利用規約 第13条）のHTML。募集が埋まった後の画面・応募前の画面どちらにも表示する。
function reportSectionHtml() {
  return `
    <span class="subLink" id="reportToggleLink" onclick="toggleReportBox()">🚩 通報する</span>
    <div id="reportBox" class="reportBox">
      <label>通報対象</label>
      <input id="reportTarget" placeholder="例：この募集について" maxlength="100" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;font-size:13px;">
      <label>通報内容</label>
      <textarea id="reportContent" rows="3" placeholder="具体的な内容をご記入ください" maxlength="1000"></textarea>
      <button id="reportSubmitBtn" onclick="submitReport()">送信する</button>
      <div id="reportStatus" class="status"></div>
    </div>
  `;
}

// M-3 (AC-M3-9): 18歳未満の深夜勤務禁止（労働基準法61条）に関する注意書き。
// この募集の時間帯が深夜（22時〜翌5時）にかかると判定できた場合は強調表示にする。
// 判定できない場合も、常時表示の注意文（土台）は表示され続ける。
// lib/nightWork.js の読み込みに失敗した場合でも、常時表示の注意文は出るようフォールバックする。
function minorNightNoticeHtml(shift) {
  const isNight = (typeof window.NightWork !== 'undefined') && window.NightWork.isNightWork(shift && shift.time);
  if (isNight) {
    return '<p class="minorNightWarning">⚠️ この募集は22時〜翌5時の時間帯にかかります。18歳未満の方は勤務できません。該当する場合は応募しないでください。</p>';
  }
  return '<p class="minorNightNote">※ 18歳未満の方は、22時〜翌5時の勤務ができません。該当する時間帯の募集には応募しないでください。</p>';
}

function render(shift) {
  currentStoreId = shift.storeId;

  if (shift.status === 'filled') {
    card.innerHTML = `
      <p class="brand">DAIDA+</p>
      <h2>🙏 募集終了</h2>
      <div class="detail">
        <strong>${escapeHtml(shift.store_name)}</strong><br>
        ${escapeHtml(shift.date)} ${escapeHtml(shift.time)}
      </div>
      <p class="result filled">すでに他のスタッフが対応済みです。ご確認ありがとうございました！</p>
      ${reportSectionHtml()}
    `;
    return;
  }
  const staffNames = shift.staffNames || [];
  const nameField = staffNames.length
    ? `<select id="name">
        <option value="">選択してください</option>
        ${staffNames.map((n) => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')}
      </select>`
    : `<p style="font-size:13px;color:#e74c3c;">この店舗に登録済みのスタッフがまだいません。先に通知登録画面でお名前を登録してください。</p>`;

  card.innerHTML = `
    <p class="brand">DAIDA+</p>
    <h2>🚨 急募のヘルプ</h2>
    <div class="detail">
      <strong>${escapeHtml(shift.store_name)}</strong><br>
      ${escapeHtml(shift.date)} ${escapeHtml(shift.time)}
      ${shift.note ? '<br>' + escapeHtml(shift.note) : ''}
    </div>
    ${minorNightNoticeHtml(shift)}
    <label style="font-size:13px;color:#555;">お名前（登録済みの一覧から選択）</label>
    ${nameField}
    <button id="respondBtn" onclick="respond()" ${staffNames.length ? '' : 'disabled'}>✋ このヘルプに入る</button>
    <div id="result" class="result"></div>
    ${reportSectionHtml()}
  `;
}

function toggleReportBox() {
  const box = document.getElementById('reportBox');
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

// 通報の送信（利用規約 第13条）。スタッフは管理者キーを持たないため認証なしで呼べる。
// 第13条3項の規定により、送信後は受付完了の表示のみを行い、調査状況は返さない。
async function submitReport() {
  const targetInput = document.getElementById('reportTarget');
  const contentInput = document.getElementById('reportContent');
  const statusEl = document.getElementById('reportStatus');
  const btn = document.getElementById('reportSubmitBtn');

  const target = targetInput.value.trim();
  const content = contentInput.value.trim();
  if (!target || !content) {
    statusEl.textContent = '通報対象と内容の両方を入力してください。';
    return;
  }

  btn.disabled = true;
  statusEl.textContent = '送信中...';
  try {
    const res = await fetch('/api/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ store_id: currentStoreId, target, content }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '送信に失敗しました');
    statusEl.textContent = '✅ ' + data.message;
    targetInput.value = '';
    contentInput.value = '';
  } catch (err) {
    statusEl.textContent = '❌ ' + err.message;
  } finally {
    btn.disabled = false;
  }
}

// 【確定通知の拡張・本人特定】この端末が既にDAIDA+のPush Subscriptionを持っていれば、
// そのendpoint（ブラウザが発行する推測不可能な識別子）を取得する。同名のスタッフが
// 複数登録されている場合でも、名前だけでは「どの端末から応募したか」を区別できないため、
// サーバー側はこのendpointを使って本人の端末を一意に特定し、①（あなたに決まりました）と
// ②（他の方に決まりました）を出し分ける。
// iPhoneのSafariタブで開いた場合や、通知登録前にこの画面を開いた場合など、購読が
// 存在しない・取得できない端末もある。その場合はnullを返し、サーバー側に判断を委ねる
// （endpointが送られてこない場合の扱いはserver.js側のAC-P7コメントを参照。
// ここでは「取得できない」ことを例外にせず、素直にnullとして扱うだけにとどめる）。
async function getCurrentPushEndpoint() {
  try {
    if (!('serviceWorker' in navigator)) return null;
    const registration = await navigator.serviceWorker.getRegistration('/sw.js');
    if (!registration) return null;
    const subscription = await registration.pushManager.getSubscription();
    return subscription ? subscription.endpoint : null;
  } catch (err) {
    return null;
  }
}

async function respond() {
  const btn = document.getElementById('respondBtn');
  const resultEl = document.getElementById('result');
  const nameEl = document.getElementById('name');
  const name = nameEl ? nameEl.value.trim() : '';
  if (!name) {
    resultEl.textContent = 'お名前を選択してください。';
    return;
  }
  btn.disabled = true;
  resultEl.textContent = '送信中...';

  try {
    const endpoint = await getCurrentPushEndpoint();
    const res = await fetch(`/api/shift/${shiftId}/respond`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(endpoint ? { name, endpoint } : { name }),
    });
    const data = await res.json();
    if (res.status === 409) {
      resultEl.textContent = '😢 ' + data.error;
      resultEl.className = 'result filled';
      return;
    }
    if (!res.ok) throw new Error(data.error || '送信に失敗しました');
    resultEl.textContent = '✅ ' + data.message;
    resultEl.className = 'result ok';
  } catch (err) {
    resultEl.textContent = '❌ ' + err.message;
    btn.disabled = false;
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

init();
</script>
</body>
</html>
