<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAIDA+ ｜ 店舗登録</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: #f4f6f9; padding: 20px; }
  .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 460px; margin: 40px auto; }
  .brand { font-size: 12px; font-weight: 800; letter-spacing: 0.5px; color: #00a8ff; margin: 0 0 8px; }
  h2 { margin-top: 0; }
  label { display: block; font-size: 13px; color: #555; margin-top: 6px; margin-bottom: 4px; text-align: left; }
  input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 15px; font-family: inherit; background: white; }
  button { background: #00a8ff; color: white; border: none; padding: 16px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
  button:disabled { background: #b0c4d4; }
  .linkBtn { background: none; color: #00a8ff; font-size: 13px; font-weight: normal; padding: 8px; margin-top: 8px; text-decoration: underline; }
  .note { color: #7f8c8d; font-size: 13px; margin-top: 16px; line-height: 1.6; text-align: left; }
  .hint { color: #9aa5ab; font-size: 12px; margin-top: 4px; text-align: left; }
  .status { margin-top: 16px; font-size: 14px; }
  .result, .codeArea { display: none; }
  .warn { background: #fff6e6; border: 1px solid #f5c96b; border-radius: 8px; padding: 14px; margin-top: 16px; font-size: 13px; text-align: left; line-height: 1.7; }
  .keybox { display: flex; gap: 8px; margin-top: 6px; }
  .keybox input { font-family: monospace; font-size: 13px; }
  .keybox button { width: auto; padding: 10px 14px; margin-top: 0; font-size: 13px; }
  .linkbox { display: flex; gap: 8px; margin-top: 6px; }
  .linkbox input { font-size: 12px; }
  .linkbox button { width: auto; padding: 10px 14px; margin-top: 0; font-size: 13px; }
  #qrcode { margin: 16px auto 0; width: 200px; }
  .section { margin-top: 24px; padding-top: 20px; border-top: 1px solid #eee; text-align: left; }
</style>
</head>
<body>

<div class="card" id="card">
  <p class="brand">DAIDA+</p>
  <h2>🏬 店舗の新規登録</h2>

  <div id="formArea">
    <p style="color:#7f8c8d; font-size:14px;">「店舗名」と「メールアドレス」を入力してください。入力いただいたメールアドレス宛てに「確認コード」をお送りします。</p>
    <label>店舗名</label>
    <input id="storeName" placeholder="例：〇〇店" maxlength="50">
    <p class="hint">電話番号・住所・担当者の生年月日など、店舗名の趣旨に反する個人情報は入力しないでください。</p>
    <label>メールアドレス</label>
    <input id="storeEmail" type="email" placeholder="例：owner@example.com" autocomplete="email">
    <button id="requestBtn" onclick="requestCode()">確認コードを送信</button>
    <div id="requestStatus" class="status"></div>
  </div>

  <div id="codeArea" class="codeArea">
    <p style="color:#7f8c8d; font-size:14px;" id="codeSentTo"></p>
    <label>確認コード（6桁）</label>
    <input id="codeInput" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">
    <button id="verifyBtn" onclick="verifyCode()">確認して登録する</button>
    <button type="button" class="linkBtn" onclick="backToForm()">店舗名・メールアドレスを修正する</button>
    <button type="button" class="linkBtn" onclick="requestCode(true)">コードを再送する</button>
    <div id="verifyStatus" class="status"></div>
  </div>

  <div id="resultArea" class="result">
    <div class="warn">
      ⚠️ 下の「管理者キー」は<strong>この画面を閉じると二度と表示されません。</strong>必ずコピーしてメモや社内共有ツールなどに保存してください。このキーが店長用ダッシュボードのログインパスワードになります。
    </div>

    <div class="section">
      <label>管理者キー（店長用ダッシュボードのログインに使用）</label>
      <div class="keybox">
        <input id="adminKeyOut" readonly>
        <button onclick="copyField('adminKeyOut')">コピー</button>
      </div>
    </div>

    <div class="section">
      <label>店長用ダッシュボードのURL</label>
      <div class="linkbox">
        <input id="managerUrlOut" readonly>
        <button onclick="copyField('managerUrlOut')">コピー</button>
      </div>
    </div>

    <div class="section">
      <label>スタッフ登録用リンク（このQRコード・URLをスタッフに配ってください）</label>
      <div class="linkbox">
        <input id="staffUrlOut" readonly>
        <button onclick="copyField('staffUrlOut')">コピー</button>
      </div>
      <div id="qrcode"></div>
    </div>
  </div>
</div>

<script>
const STORE_NAME_MAX_LENGTH = 50;

// 店舗名に、その項目の趣旨（店舗を識別する名称）に反する個人情報が
// 入力されていないかを簡易チェックする。サーバー側（/api/stores）でも同じ内容を
// 検証しているため、ここでの制限はユーザーへの早期フィードバック目的であり、
// セキュリティ上の最終防衛はサーバー側にある。
function findPersonalInfoIssue(value) {
  const v = String(value || '');

  const digitCount = (v.match(/\d/g) || []).length;
  if (digitCount >= 4) {
    return '電話番号や生年月日など、数字を含む個人情報は入力しないでください。';
  }

  if (/[^\s@]+@[^\s@]+\.[^\s@]+/.test(v)) {
    return 'メールアドレスは入力しないでください。';
  }

  if (/(男性|女性|male|female)/i.test(v)) {
    return '性別などの個人情報は入力しないでください。';
  }

  return null;
}

let pendingName = '';
let pendingEmail = '';

async function requestCode(isResend) {
  const btn = document.getElementById('requestBtn');
  const verifyBtn = document.getElementById('verifyBtn');
  const statusEl = document.getElementById('requestStatus');
  const verifyStatusEl = document.getElementById('verifyStatus');

  const name = isResend ? pendingName : document.getElementById('storeName').value.trim();
  const email = isResend ? pendingEmail : document.getElementById('storeEmail').value.trim();

  if (!name) {
    statusEl.textContent = '店舗名を入力してください。';
    return;
  }
  if (name.length > STORE_NAME_MAX_LENGTH) {
    statusEl.textContent = `店舗名は${STORE_NAME_MAX_LENGTH}文字以内で入力してください。`;
    return;
  }
  const personalInfoIssue = findPersonalInfoIssue(name);
  if (personalInfoIssue) {
    statusEl.textContent = personalInfoIssue;
    return;
  }
  if (!email) {
    statusEl.textContent = 'メールアドレスを入力してください。';
    return;
  }

  if (isResend) {
    verifyBtn.disabled = true;
    verifyStatusEl.textContent = '再送中...';
  } else {
    btn.disabled = true;
    statusEl.textContent = '送信中...';
  }

  try {
    const res = await fetch('/api/signup/request-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '送信に失敗しました');

    pendingName = name;
    pendingEmail = email;

    document.getElementById('codeSentTo').textContent =
      `${email} 宛てに確認コードを送信しました。メールに記載の6桁のコードを入力してください（届かない場合は迷惑メールフォルダもご確認ください）。`;
    document.getElementById('formArea').style.display = 'none';
    document.getElementById('codeArea').style.display = 'block';

    if (isResend) {
      verifyStatusEl.textContent = '✅ 再送しました。';
    } else {
      document.getElementById('codeInput').value = '';
      statusEl.textContent = '';
    }
  } catch (err) {
    if (isResend) {
      verifyStatusEl.textContent = '❌ ' + err.message;
    } else {
      statusEl.textContent = '❌ ' + err.message;
    }
  } finally {
    btn.disabled = false;
    verifyBtn.disabled = false;
  }
}

function backToForm() {
  document.getElementById('codeArea').style.display = 'none';
  document.getElementById('formArea').style.display = 'block';
  document.getElementById('verifyStatus').textContent = '';
}

async function verifyCode() {
  const btn = document.getElementById('verifyBtn');
  const statusEl = document.getElementById('verifyStatus');
  const code = document.getElementById('codeInput').value.trim();
  if (!code) {
    statusEl.textContent = '確認コードを入力してください。';
    return;
  }
  btn.disabled = true;
  statusEl.textContent = '確認中...';

  try {
    const res = await fetch('/api/signup/verify-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: pendingEmail, code }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '確認に失敗しました');

    const origin = location.origin;
    const staffUrl = `${origin}/?store=${data.storeId}`;
    const managerUrl = `${origin}/manager.html`;

    document.getElementById('adminKeyOut').value = data.adminKey;
    document.getElementById('managerUrlOut').value = managerUrl;
    document.getElementById('staffUrlOut').value = staffUrl;

    document.getElementById('codeArea').style.display = 'none';
    document.getElementById('resultArea').style.display = 'block';

    new QRCode(document.getElementById('qrcode'), {
      text: staffUrl,
      width: 200,
      height: 200,
    });
  } catch (err) {
    statusEl.textContent = '❌ ' + err.message;
    btn.disabled = false;
  }
}

function copyField(id) {
  const el = document.getElementById(id);
  el.select();
  el.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(el.value).catch(() => document.execCommand('copy'));
}
</script>
</body>
</html>
